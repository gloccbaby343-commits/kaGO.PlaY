    <script>
      // Suppress and gracefully stub Vite HMR WebSocket in cloud preview/iframe environments
      (function() {
        if (typeof window !== 'undefined') {
          var OrigWebSocket = window.WebSocket;
          if (OrigWebSocket) {
            window.WebSocket = function(url, protocols) {
              if (
                protocols === 'vite-hmr' || 
                (typeof protocols === 'string' && protocols.includes('vite')) || 
                (Array.isArray(protocols) && protocols.includes('vite-hmr'))
              ) {
                var dummy = new EventTarget();
                dummy.binaryType = 'blob';
                dummy.readyState = 1; // WebSocket.OPEN
                dummy.url = String(url);
                dummy.protocol = 'vite-hmr';
                dummy.extensions = '';
                dummy.bufferedAmount = 0;
                dummy.send = function() {};
                dummy.close = function() {};
                setTimeout(function() {
                  try {
                    dummy.dispatchEvent(new Event('open'));
                  } catch (e) {}
                }, 10);
                return dummy;
              }
              return new OrigWebSocket(url, protocols);
            };
            window.WebSocket.prototype = OrigWebSocket.prototype;
            window.WebSocket.CONNECTING = OrigWebSocket.CONNECTING;
            window.WebSocket.OPEN = OrigWebSocket.OPEN;
            window.WebSocket.CLOSING = OrigWebSocket.CLOSING;
            window.WebSocket.CLOSED = OrigWebSocket.CLOSED;
          }

          // Error and rejection suppressors for WebSocket / HMR messages
          window.addEventListener('error', function(e) {
            if (e && (
              (e.message && (e.message.includes('WebSocket') || e.message.includes('ws://') || e.message.includes('wss://') || e.message.includes('@vite/client'))) ||
              (e.error && e.error.message && (e.error.message.includes('WebSocket') || e.error.message.includes('ws://') || e.error.message.includes('wss://')))
            )) {
              e.preventDefault();
              e.stopImmediatePropagation();
              return true;
            }
          }, true);

          window.addEventListener('unhandledrejection', function(e) {
            if (e && e.reason) {
              var msg = typeof e.reason === 'string' ? e.reason : (e.reason.message || '');
              if (msg.includes('WebSocket') || msg.includes('ws://') || msg.includes('wss://') || msg.includes('@vite/client')) {
                e.preventDefault();
                e.stopImmediatePropagation();
                return true;
              }
            }
          }, true);

          var origOnError = window.onerror;
          window.onerror = function(msg, url, lineNo, colNo, error) {
            var str = String(msg || '') + ' ' + String(url || '') + ' ' + (error ? String(error.message || '') : '');
            if (str.includes('WebSocket') || str.includes('ws://') || str.includes('wss://') || str.includes('@vite/client')) {
              return true;
            }
            if (origOnError) return origOnError.apply(this, arguments);
            return false;
          };
        }
      })();
    </script>
