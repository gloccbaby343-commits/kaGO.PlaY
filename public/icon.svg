<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Background with squircle safe-zone padding -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <circle cx="256" cy="256" r="190" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="2"/>
  <circle cx="256" cy="256" r="145" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1.5"/>

  <!-- Glowing vinyl disc outer & grooves -->
  <circle cx="256" cy="256" r="110" fill="#0d1117" stroke="url(#accent)" stroke-width="3" filter="url(#glow)"/>
  
  <!-- Audio wave bars radiating/centered -->
  <g fill="url(#accent)">
    <rect x="176" y="226" width="12" height="60" rx="6" />
    <rect x="200" y="196" width="12" height="120" rx="6" />
    <rect x="224" y="166" width="12" height="180" rx="6" />
    <rect x="248" y="140" width="16" height="232" rx="8" />
    <rect x="276" y="166" width="12" height="180" rx="6" />
    <rect x="300" y="196" width="12" height="120" rx="6" />
    <rect x="324" y="226" width="12" height="60" rx="6" />
  </g>

  <!-- Glowing playback accent dot -->
  <circle cx="256" cy="256" r="16" fill="#ffffff" filter="url(#glow)"/>
</svg>
